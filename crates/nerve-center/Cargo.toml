[package]
name = "nerve-center"
description = "The Nerve center as an MCP server: pairs nodes, holds their links, maps their capabilities to MCP tools, serves the center web UI."
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nerve-center"
path = "src/main.rs"

[dependencies]
nerve-proto.workspace = true
nerve-transport.workspace = true
# The help page reads the node's command list from its CLI definition.
nerve-node.workspace = true
# The audit buttons write rules in the node's own rule syntax.
nerve-policy.workspace = true
# io-std for MCP over stdio; process/time/sync/signal for the action checker's
# local llama-server; all features of the existing tokio, no new crate.
tokio = { workspace = true, features = ["io-std", "process", "time", "sync", "signal"] }
# The action checker's blocklist: path and command globs (globset, in the
# lock already) and a `re:` regex form for the few defaults a glob cannot
# express (regex, already in the lock through globset).
globset.workspace = true
regex = "1"
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# `env` lets every flag come from the MCP client entry's environment as well.
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The paused clock, for the ten minutes a job's result is kept (no new crate).
tokio = { workspace = true, features = ["test-util"] }
