[package]
name = "nerve-node"
description = "The Nerve node: links a machine to its centers under the owner's policy."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nerve-node"
path = "src/main.rs"

[dependencies]
nerve-proto.workspace = true
nerve-transport.workspace = true
nerve-policy.workspace = true
nerve-sandbox.workspace = true
nerve-service.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
tracing.workspace = true
globset.workspace = true
ring.workspace = true
base64.workspace = true
keyring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Beyond the job object and the known folders: the service (Services), its
# account and rights (NetManagement, Authentication_Identity), the folders'
# DACL (Authorization), the stored password (Cryptography), and starting a
# command as another account (Pipes, Environment, Storage_FileSystem).
# Registry reads an account's profile folder and hides `nerve` from the
# sign-in screen; Console reads a password without echo and sends a stopped
# command Ctrl+C; WindowsProgramming names the account that runs a command.
# EventLog writes the installed node's start, stop and failures to the
# Windows Event Log. WindowsAndMessaging asks a stopped command's windows to
# close. LibraryLoader keeps DLLs to System32 (src/main.rs). IO watches the
# granted folders for new names (src/grant_watch.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
# A test reads what the process logs through its own subscriber.
tracing-subscriber.workspace = true
# The conformance suite's fake center drives the link tests.
nerve-conformance = { path = "../nerve-conformance" }

[target.'cfg(windows)'.dev-dependencies]
# A test reads the Event Log messages back out of the program.
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }
