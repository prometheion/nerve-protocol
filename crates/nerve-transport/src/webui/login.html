<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f9">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
  <form class="login-form" method="post" action="/login">
    <div class="login-head">
      <img class="login-mark" src="/icon.svg" alt="" width="56" height="56">
      <h1>Nerve</h1>
      <p>{{TAGLINE}}</p>
    </div>
    <input class="login-input" type="password" name="token" placeholder="{{SECRET}}" aria-label="{{SECRET}}" aria-describedby="login-error" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus required>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <button class="login-submit" type="submit">Sign in</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
