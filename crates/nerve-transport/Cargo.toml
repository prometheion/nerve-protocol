[package]
name = "nerve-transport"
description = "Nerve Protocol transport: TLS pinning, loopback rule, CONNECT proxies, WebSocket link, node keys, small HTTP, control sockets, the log."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nerve-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
httparse.workspace = true
ring.workspace = true
base64.workspace = true
rcgen.workspace = true
# The log both programs write: a tracing layer and the subscriber that holds it.
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The paused clock, for the time limits of the small HTTP (no new crate).
tokio = { workspace = true, features = ["test-util"] }
