[package]
name = "nerve-service"
description = "What the Nerve node's and center's services share: accounts, systemd, the files root writes, the passphrase prompt, and update."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nerve-transport.workspace = true
nerve-policy.workspace = true
serde_json.workspace = true
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The passphrase prompt reads a line without echo from the console. The
# services share the service control manager (Services), the folders' and
# the pipe's DACL (Security, Authorization), the Event Log and its source
# (EventLog, Registry), the pipe (Pipes, tokio's named pipes) and the job
# object with its limits (JobObjects, IO and SystemServices for the memory
# limit's message, Threading for the CPUs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
