# The checks on every pull request, and on main after a merge: fmt, clippy and
# the whole test suite, on Linux and on Windows, the tests that differ on
# musl, the C library of the released Linux programs, those programs built
# as the release builds them and installed on Ubuntu 22.04 and 24.04 (x86_64
# and arm64), Ubuntu 26.04, Debian 12 and 13, with the node's keys in the system keyring, the
# real-machine tests and the center as a service, on kernels older than 7.1
# (6.8 and 7.0), and the desktop app's own install. A test
# that skips says why, and a job fails on a skip that .github/test-skips.txt
# does not give it (docs/dev/building.md). The release workflow runs
# the same fmt, clippy and tests on Linux before it builds anything
# (docs/dev/releasing.md); for Windows it runs the install test of
# `windows-installed` on the programs it built, not the whole suite.
#
# The Windows job runs the same `cargo test --workspace`, so the tests that are
# compiled only on Windows run there: grants, the integrity level, the service
# steps, the job object, the AppContainer, Windows paths and rules. The tests
# that need a machine of their own (the node or the center installed as a
# service, an administrator account with a password, a virtual disk) carry
# `#[ignore = "<reason>"]`, so every run lists them as ignored with the
# reason; the `windows-installed` job runs them on a runner of its own
# (.github/workflows/installed-windows.yml). Its programs, the debug
# `nerve-node-desktop.exe` and `nerve-center.exe`, are an artifact of the
# `windows` job for three days, to try on a Windows test machine.
#
# `pull_request` runs the merge of the branch into main, with a read-only token
# and no secrets, also for a pull request from a fork. Nothing here writes to
# the repository, and no secrets are used. The actions are pinned by commit.
#
# The cargo cache is saved by the runs on main as well, because a pull request
# can only read the caches of its own branch and of main: without them every
# new pull request would start cold. A cache is saved once per key (the
# toolchain and Cargo.lock) and only by a run whose job passed, so the first
# green run on main after a lock file change saves it.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request replaces its run that is still going. A push to
# main has a group of its own (its commit), so no run on main waits behind
# another or is replaced by a later one: each commit there gets its result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The toolchain the release is built with (RUST_TOOLCHAIN in release.yml; raise
  # both together), so a pull request is checked the way the release is.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never
  # A CI run never builds twice, so incremental compilation only fills the cache.
  CARGO_INCREMENTAL: "0"
  # A test that fails on a machine nobody can reach says where.
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      # Before the cache, so a badly formatted pull request fails in seconds.
      - run: cargo fmt --check
      # The web UIs' JavaScript is served as it is, with no build step, and the
      # Rust tests only look for words in it: a syntax error would keep a
      # whole UI from starting. node checks every script parses.
      - name: The web UIs' JavaScript parses
        run: |
          node --version
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n 1 node --check
      # The key holds the lock file and no restore key follows it: a changed
      # lock file builds once from scratch, and the cache never collects the
      # dependencies it once had.
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      # The desktop app (crates/nerve-node-desktop) links the system's fontconfig.
      - name: Build dependencies of the desktop app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The limits test of a node run by hand
      # (exec::tests::a_command_is_held_to_its_limits_in_a_cgroup_of_its_own)
      # runs its commands in a scope of the runner's own systemd user manager.
      # Lingering starts that manager; its bus is named for the tests.
      - name: A systemd user session for the runner
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ]
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      # The Landlock tests skip where the kernel has none: the job fails
      # instead when the runner's kernel has less than it had (7.0, ABI 8, at
      # the time of writing; ABI 6 is what folder mode asks for).
      - name: Landlock
        run: python3 .github/scripts/landlock-abi.py 6
      - name: The skip check's own test
        run: python3 .github/scripts/skips.py --self-test
      # The whole workspace, with the end-to-end tests that start the real
      # programs (Unix only). `--no-fail-fast` shows every failing test at once;
      # `--show-output` prints what each test printed, so the next step sees
      # the tests that skipped.
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast -- --show-output 2>&1 | tee "$RUNNER_TEMP/tests.log"
      # A test that cannot run here returns early and says why ("skipped: ...").
      # The job fails on one that .github/test-skips.txt does not let it skip.
      - name: Skipped tests
        if: success() || failure()
        run: python3 .github/scripts/skips.py --job linux "$RUNNER_TEMP/tests.log"
      # The tests that need root, which the run above skips: root's backup and
      # restore on a node of another user open the file as the user who asked
      # (crates/nerve-node/src/caller_file.rs), root starts in a folder only
      # its owner may enter, the ACL walk of uninstall and of revoked
      # grants on files of other uids and on another file system, and a node
      # that runs as root keeps its rights over other accounts' files, as it
      # gives its commands no namespace (crates/nerve-node/tests/own_proc.rs).
      # They run as root of a user namespace where the machine gives one that
      # may change owners and mount; ubuntu-24.04 restricts those with
      # AppArmor. Here only the test programs run as root, not cargo.
      - name: Tests that need root, as root
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: |
          {
            cargo test --locked -p nerve-node --test backup_caller --test root_start -- --show-output
            cargo test --locked -p nerve-node --lib -- --show-output --exact \
              acl::tests::remove_all_gives_what_nerve_run_made_to_the_owner \
              acl::tests::remove_all_gives_no_file_with_a_second_name \
              acl::tests::a_revoked_inner_grant_on_another_file_system_stays_stale \
              acl::tests::a_revoked_inner_grant_the_owner_cannot_reach_stays_stale \
              grant_watch::tests::a_granted_folder_unmounted_and_mounted_again_is_watched_again \
              grant_watch::tests::a_drive_mounted_over_a_watched_granted_folder_is_watched_instead
            cargo test --locked -p nerve-node --test own_proc -- --show-output --exact \
              a_root_node_keeps_its_rights_over_other_accounts_files
          } 2>&1 | tee "$RUNNER_TEMP/root.log"
      - name: Skipped tests, as root
        if: success() || failure()
        run: python3 .github/scripts/skips.py --job linux-root "$RUNNER_TEMP/root.log"
      # A command's own /proc (crates/nerve-node/tests/own_proc.rs): the shim
      # makes a user namespace as the runner's account, which ubuntu-24.04's
      # AppArmor holds back from a program without a profile that allows it
      # (`kernel.apparmor_restrict_unprivileged_userns`). The installed node
      # brings its own profile (the `installed` job installs it); here the
      # restriction is lifted for these tests. Root makes no namespace, so
      # they cannot run in the step above. The last step that runs tests, as
      # it changes the machine.
      - name: Tests of a command's own /proc, user namespaces open
        run: |
          restrict=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ ! -e "$restrict" ] || echo 0 | sudo tee "$restrict" > /dev/null
          cargo test --locked -p nerve-node --test own_proc -- --show-output 2>&1 | tee "$RUNNER_TEMP/own_proc.log"
      - name: Skipped tests, user namespaces open
        if: success() || failure()
        run: python3 .github/scripts/skips.py --job linux-userns "$RUNNER_TEMP/own_proc.log"

  # The released Linux programs are static, built against musl
  # (release.yml), and the standard library differs there: it drops O_PATH
  # from `OpenOptions::custom_flags`, as musl's O_ACCMODE holds it. The walk
  # that gives the node's and the center's folders away (install,
  # uninstall) opened sockets, links and FIFOs on musl only, so its tests
  # run on that target as well. Then the programs are built as the release
  # builds them, on each architecture's own runner, with the test programs
  # of the real-machine tests, for the `installed` job.
  musl:
    name: Linux musl ${{ matrix.arch }} (folder walk, the release build)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      SUFFIX: ${{ matrix.arch }}-linux
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: A C compiler for musl (ring's C parts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-musl-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Tests
        run: cargo test --locked --target "$TARGET" -p nerve-node --lib -- service::tests::chown
      # The command of release.yml's `linux` job.
      - name: The release build
        run: |
          cargo build --release --locked --target "$TARGET" -p nerve-center -p nerve-node
          mkdir -p dist/tests
          for b in nerve-center nerve-node; do
            cp "target/$TARGET/release/$b" "dist/$b-$SUFFIX"
          done
      - name: The test programs
        run: |
          cargo test --locked --target "$TARGET" -p nerve-node \
            --test real_account --test real_root_owner --test keyring --no-run --message-format=json \
            | python3 -c 'import json,sys; [print(m["target"]["name"], m["executable"]) for m in map(json.loads, sys.stdin) if m.get("executable") and m["target"]["kind"] == ["test"]]' \
            > "$RUNNER_TEMP/tests.path"
          while read -r name exe; do strip -o "dist/tests/$name" "$exe"; done < "$RUNNER_TEMP/tests.path"
          ls -l dist dist/tests
          test "$(find dist/tests -type f | wc -l)" = 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-musl-${{ matrix.arch }}
          path: dist/nerve-*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-musl-tests-${{ matrix.arch }}
          path: dist/tests/*
          if-no-files-found: error
          retention-days: 3

  # The node keeps its keys in the system keyring on every Linux kernel, and
  # folder mode runs as the account `nerve-run` (issue #135). The programs the
  # `musl` job built are installed on Ubuntu 22.04 and 24.04 (x86_64 and
  # arm64), Ubuntu 26.04, and Debian 12 and 13, and take the whole path an
  # owner takes: the real-machine tests (folder grants, an owner's program as
  # a provider held to the folders, capabilities of node.toml, rules on their
  # arguments, the limits per command in the service's cgroup, root as the owner), then
  # `setup` in a terminal answering yes to the keyring, the keys moving out of
  # their files, the keyring test as `nerve`, a restart of the keyring's
  # session and of the node, `status`, a folder mode command as `nerve-run`,
  # the web UI, and `uninstall --purge`; then the center installed as a
  # service, driven over MCP, updated, uninstalled. A real test that skips
  # fails the job. The kernels are GitHub's Azure kernels, not the ones the
  # distributions ship: the 5.15 kernel of a 22.04 install, and a kernel
  # without Landlock, are not tested here (the second only on a test VM); the
  # script fails when a runner gets a kernel of 7.1 or later, so the job
  # cannot go on passing while it tests nothing below 7.1. The script sets up
  # nothing a real machine would not have, except the owner it needs (a
  # person who installs) and a system-wide environment that names another
  # user's session, as the runner image's does (.github/workflows/installed.yml).
  installed:
    name: Installed
    needs: musl
    uses: ./.github/workflows/installed.yml
    with:
      binaries: linux-musl-{0}
      tests: linux-musl-tests-{0}

  # The desktop app's own install on Linux (crates/nerve-node-desktop/tests/real.rs):
  # through the code its buttons run, as root, it installs the node as a
  # service with the app's menu entry and link handler, stops, starts and
  # restarts the service, updates the program from a file and uninstalls it
  # all. The window is drawn headless, in software.
  desktop-real:
    name: Desktop app install on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-desktop-real-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build dependencies of the desktop app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Build the app and the test program
        run: |
          cargo test --locked -p nerve-node-desktop --test real --no-run --message-format=json \
            | python3 -c 'import json,sys; print(*[m["executable"] for m in map(json.loads, sys.stdin) if m.get("executable") and m["target"]["name"] == "real"])' \
            > "$RUNNER_TEMP/real.path"
          cat "$RUNNER_TEMP/real.path"
          test -x target/debug/nerve-node-desktop
      # As root, as the app's install runs once a person said yes; the
      # runner's account is the owner (SUDO_USER).
      # A test that returns early says so with `skipped` at the start of a
      # line, or behind `test <name> ... ` with one test thread; here that fails
      # the step.
      - name: Install, control, update and uninstall
        run: |
          sudo NERVE_DESKTOP_REAL="$PWD/target/debug/nerve-node-desktop" "$(cat "$RUNNER_TEMP/real.path")" \
            --ignored --exact --nocapture install_control_update_and_uninstall_on_this_machine 2>&1 \
            | tee "$RUNNER_TEMP/real.log"
          if grep -E '(^|\.\.\. )skipped' "$RUNNER_TEMP/real.log"; then exit 1; fi

  # Linux never compiles the Windows branches, so clippy and the tests must run
  # here too: nerve-node, nerve-sandbox and nerve-policy have Windows-only code
  # and tests, and the Unix-only tests (end-to-end, Landlock) are compiled out.
  windows:
    name: Windows (fmt, clippy, tests)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # The Windows image sets core.autocrlf=true, so a checkout would write CRLF
      # line endings: include_str! would embed a CRLF page and a test that looks
      # for "\n" in it would fail. The repository is LF everywhere.
      - name: Check out with LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # After the checkout: the check is a script of the repository.
      - name: The machine
        shell: pwsh
        run: ./.github/scripts/windows-runner.ps1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The tests marked `#[ignore = "<reason>"]` stay ignored and are listed
      # as such in the output. No test is skipped by name.
      # TMP and TEMP point at the runner's temp folder, a long-name path
      # (D:\a\_temp). The default is C:\Users\RUNNER~1\AppData\Local\Temp, and
      # tempfile hands out that 8.3 short form: a test that compares it with the
      # long form the node walks finds no match, and an AppContainer is denied
      # the short-name path of the folder it was granted.
      - name: Tests
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          cargo test --locked --workspace --no-fail-fast --
          --show-output 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Skipped tests
        if: success() || failure()
        run: python .github/scripts/skips.py --job windows "$RUNNER_TEMP/tests.log"
      # The debug programs for a Windows test machine, and the test programs of
      # the `windows-installed` job, each under a name of its own.
      - name: The programs and the test programs
        run: |
          cargo build --locked -p nerve-node-desktop -p nerve-center
          mkdir -p dist/tests
          cp target/debug/nerve-node-desktop.exe target/debug/nerve-center.exe dist/
          .github/scripts/windows-test-programs.sh dist/tests
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-programs
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tests
          path: dist/tests/*
          if-no-files-found: error
          retention-days: 3

  # The Windows programs on a runner of their own, installed: the app's own
  # install, the sudo switch and the limits per command on the installed
  # service, an administrator's batch logon, a virtual disk, and the center
  # as a Windows service. A test that skips fails the job.
  windows-installed:
    name: Installed on Windows
    needs: windows
    uses: ./.github/workflows/installed-windows.yml
    with:
      programs: windows-programs
      tests: windows-tests
