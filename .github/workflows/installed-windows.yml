# The Windows programs installed and driven on a real machine: GitHub's
# windows-2025 runner, an elevated administrator on a disposable virtual
# machine. CI calls it with the debug programs and test programs its `windows`
# job built (first version, docs/dev/windows.md "Tests on an installed
# node"); it grows with each part of the Windows node that needs a machine of
# its own.
#
# The job makes an administrator account and a standard account of its own,
# with random passwords and their profiles loaded (nobody signs in on a
# runner), then runs:
# - the desktop app's own install, control, update and uninstall
#   (crates/nerve-node-desktop/tests/real.rs);
# - with the node installed again by that account, its owner: the sudo
#   switch end to end, refused from a center and off after a restart of the
#   service (crates/nerve-node/tests/win_sudo.rs), a provider on the provider
#   pipe (crates/nerve-node/tests/win_provider.rs), the keys and a proxy's
#   password in the service's Credential Manager through backup and restore
#   (crates/nerve-node/tests/win_vault.rs), the limits per
#   command on the service (crates/nerve-node/tests/win_limits.rs), and
#   folder and allowlist mode as the command account nerve-run, each pairing
#   in its AppContainer: folders, a closed folder, another pairing's folders,
#   home and processes (by a command and by the node's file calls), nerve-run's
#   profile and the node's pipes from a container, allowlist mode and
#   --as-owner, a folder in the owner's profile split around a protected
#   entry, a folder outside the owner's profile, what nerve-run opens, the
#   network switch, a pairing's home and container profile
#   (crates/nerve-node/tests/win_account.rs), and in smaller tests of
#   it, a command the folder sync refuses in the audit log and a granted
#   folder that becomes a link to another machine (also where the node
#   cannot log on as the owner). The install makes
#   nerve-run and its profile itself, by a logon that loads it, as nobody
#   signs in on a runner;
# - the administrator's batch logon (nerve-node's
#   win_host::tests::an_administrators_batch_logon_has_the_full_token) and a
#   folder on a virtual disk mounted in a folder (nerve-sandbox's
#   tests::a_folder_on_a_volume_mounted_in_a_folder_is_found_again), and a
#   backup's folder on a FAT32 virtual disk (nerve-service's
#   win::dacl::tests::a_folder_on_a_volume_without_lists_is_held);
# - the center as a Windows service: its install, `status`, its restart
#   actions, its web UI in Chrome, what a standard account and the
#   administrator's other account can and cannot do to it and to its pipe, a
#   second center that attaches to a first, backup and restore, update (also
#   to another build) and uninstall (crates/nerve-center/tests/win_service.rs);
# - what the install puts on the machine as Windows has it: the Start menu's
#   link, the handler of nerve:// links, the entry in Apps & features; then
#   the entry's quiet uninstall (winget's), which keeps the data, and
#   `--silent`, which installs again without a question.
# The release calls it too, with the release-profile programs it is about to
# publish.
# A test that skips fails the job. The account's password is masked in the
# log and goes nowhere but the tests of this job.
name: Installed on Windows

on:
  workflow_call:
    inputs:
      programs:
        description: "The artifact with nerve-node-desktop.exe and nerve-center.exe (CI's debug ones, or the release's)"
        type: string
        required: true
      tests:
        description: "The artifact with the test programs real.exe, win_sudo.exe, win_provider.exe, win_vault.exe, win_limits.exe, win_account.exe, win_service.exe, nerve_node_lib.exe, nerve_sandbox_lib.exe and nerve_service_lib.exe"
        type: string
        required: true
      ref:
        description: "The commit whose scripts run (the default: the commit of the run)"
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  installed:
    name: Windows Server 2025 x86_64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      # As in the `windows` job: a long-name temp folder. The `runner` context
      # is not there for a job's own env, so a step writes it for the others.
      - name: The temporary folder by its long name
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: The machine
        run: ./.github/scripts/windows-runner.ps1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.programs }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.tests }}
          path: dist/tests
      - name: The programs
        run: Get-ChildItem dist, dist/tests | Format-Table Name, Length
      # An administrator of its own: the runner's account has a password
      # nobody knows, and the node's commands run as an account whose password
      # the install stores.
      - name: An administrator account with its profile
        run: |
          $name = 'nervetest'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          $pw = [Convert]::ToBase64String($bytes) + 'a1!'
          "::add-mask::$pw"
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name $name -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member $name
          # A logon that loads the profile makes it, as a first sign-in would.
          $cred = New-Object System.Management.Automation.PSCredential(".\$name", $secure)
          Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/c', 'exit' `
            -Credential $cred -LoadUserProfile -WorkingDirectory "$env:SystemRoot" -Wait
          $sid = (Get-LocalUser $name).SID.Value
          $profile = Get-CimInstance Win32_UserProfile | Where-Object SID -eq $sid
          if (-not $profile) { throw "$name has no profile" }
          "the account $name ($sid), its profile $($profile.LocalPath)" >> $env:GITHUB_STEP_SUMMARY
          "NERVE_WIN_SUDO_ACCOUNT=$name" >> $env:GITHUB_ENV
          "NERVE_WIN_SUDO_PASSWORD=$pw" >> $env:GITHUB_ENV
          "NERVE_TEST_SID=$sid" >> $env:GITHUB_ENV
      # A standard account, for what an account without the administrators'
      # rights must not do: read the center's state, take the owner's
      # places on its ports, or make a pipe a harness trusts.
      - name: A standard account with its profile
        run: |
          $name = 'nervestd'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          $pw = [Convert]::ToBase64String($bytes) + 'a1!'
          "::add-mask::$pw"
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name $name -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $name -ErrorAction SilentlyContinue
          $cred = New-Object System.Management.Automation.PSCredential(".\$name", $secure)
          Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/c', 'exit' `
            -Credential $cred -LoadUserProfile -WorkingDirectory "$env:SystemRoot" -Wait
          "NERVE_WIN_STD_ACCOUNT=$name" >> $env:GITHUB_ENV
          "NERVE_WIN_STD_PASSWORD=$pw" >> $env:GITHUB_ENV
      - name: The app installs, controls, updates and uninstalls Nerve
        run: |
          $env:NERVE_DESKTOP_REAL = (Resolve-Path dist/nerve-node-desktop.exe).Path
          $said = & dist/tests/real.exe --ignored --exact --nocapture install_control_update_and_uninstall_on_this_machine 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/real.log" | Out-String
          Write-Host $said
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A renamed test matches nothing, and the run then ends well.
          if ($said -notmatch 'test result: ok\. 1 passed') { throw 'the install test did not run' }
      # As the app's install runs for that account's owner: the broker names
      # the owner by SID, and the password goes on stdin.
      - name: The node installed by the account, nerve-run for commands
        run: |
          $env:NERVE_DESKTOP_USER_SID = $env:NERVE_TEST_SID
          $env:NERVE_WIN_SUDO_PASSWORD | & dist/nerve-node-desktop.exe install 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/install.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($said in "run commands as $env:NERVE_WIN_SUDO_ACCOUNT", 'made the user nerve-run',
            'nerve-run cannot open the node''s folders', 'the service nerve-run-profile') {
            if (-not (Select-String -Quiet -SimpleMatch -Path "$env:RUNNER_TEMP/install.log" -Pattern $said)) {
              throw "the install did not say: $said"
            }
          }
          $run = Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -like '*\nerve-run' }
          if (-not $run) { throw 'nerve-run has no profile' }
          if ((Get-Service nerve-run-profile).Status -ne 'Running') { throw 'nerve-run-profile does not run' }
      # What the install put on the machine, read as Windows reads it: the
      # Start menu's link, the handler of nerve:// links, and the entry in
      # Apps & features with the quiet uninstall winget runs.
      - name: The Start menu, nerve:// and Apps & features
        run: |
          $exe = "$env:ProgramFiles\Nerve\nerve-node-desktop.exe"
          $link = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Nerve.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu link at $link" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          if ($target -ne $exe) { throw "the Start menu link leads to $target, not $exe" }
          $scheme = Get-Item 'Registry::HKEY_CLASSES_ROOT\nerve'
          if ($null -eq $scheme.GetValue('URL Protocol')) { throw 'nerve is no URL protocol' }
          $open = (Get-Item 'Registry::HKEY_CLASSES_ROOT\nerve\shell\open\command').GetValue('')
          if ($open -ne "`"$exe`" `"%1`"") { throw "a nerve:// link runs $open" }
          # The app's program has no console: piped, PowerShell waits for it.
          $version = ((& $exe --version | Out-String).Trim() -split ' ')[-1]
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Nerve'
          $want = @{
            DisplayName = 'Nerve'
            DisplayVersion = $version
            UninstallString = "`"$exe`" __desktop-uninstall"
            QuietUninstallString = "`"$exe`" uninstall"
          }
          foreach ($k in $want.Keys) {
            if ($entry.$k -ne $want[$k]) { throw "Apps & features: $k is '$($entry.$k)', not '$($want[$k])'" }
          }
          "the Start menu link, nerve:// and Apps & features (Nerve $version)" >> $env:GITHUB_STEP_SUMMARY
      - name: Sudo, providers, limits, the command account, the batch logon, a virtual disk
        run: |
          $runs = @(
            @('win_sudo.exe', 'sudo_runs_a_listed_command_elevated_on_the_installed_service'),
            @('win_provider.exe', 'the_owners_program_attaches_on_the_provider_pipe'),
            @('win_vault.exe', 'the_service_keeps_its_secrets_in_its_own_credential_manager'),
            @('win_limits.exe', 'the_installed_service_holds_a_command_to_its_memory_limit'),
            @('win_account.exe', 'folder_and_allowlist_mode_run_as_nerve_run_in_their_containers'),
            @('win_account.exe', 'a_command_the_folder_sync_refuses_is_in_the_audit_log'),
            @('win_account.exe', 'a_granted_folder_that_becomes_a_link_to_another_machine_is_not_followed_by_the_sync'),
            @('win_account.exe', 'a_link_to_another_machine_is_not_followed_where_the_node_cannot_act_as_the_owner'),
            @('nerve_node_lib.exe', 'win_host::tests::an_administrators_batch_logon_has_the_full_token'),
            @('nerve_sandbox_lib.exe', 'tests::a_folder_on_a_volume_mounted_in_a_folder_is_found_again'),
            @('nerve_service_lib.exe', 'win::dacl::tests::a_folder_on_a_volume_without_lists_is_held'),
            @('nerve_service_lib.exe', 'win::dacl::tests::a_folder_over_a_share_is_remote')
          )
          $failed = 0
          foreach ($r in $runs) {
            $said = & "dist/tests/$($r[0])" --ignored --exact --nocapture --test-threads=1 $r[1] 2>&1 |
              Tee-Object -Append "$env:RUNNER_TEMP/installed.log" | Out-String
            Write-Host $said
            if ($LASTEXITCODE -ne 0) { $failed++ }
            # A renamed or moved test matches nothing, and `cargo test` then
            # ends well with "0 passed".
            elseif ($said -notmatch 'test result: ok\. 1 passed') {
              "no test ran for $($r[1])"
              $failed++
            }
          }
          if ($failed) { throw "$failed of the installed tests failed" }
      # What the node and the runner say when an installed test failed: what
      # passes on a test machine may meet another Windows here.
      - name: The node's log and the test folders, after a failure
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          [Environment]::OSVersion.VersionString
          $nt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($nt.ProductName) $($nt.DisplayVersion) build $($nt.CurrentBuild).$($nt.UBR)"
          'EnableLUA: ' + (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          whoami /all
          # Who may pass through folders they may not open (a command's
          # container passes C:\ and the owner's folders so) and log on.
          secedit /export /areas USER_RIGHTS /cfg "$env:RUNNER_TEMP/rights.inf" | Out-Null
          Get-Content "$env:RUNNER_TEMP/rights.inf" | Select-String 'SeChangeNotifyPrivilege|SeBatchLogonRight|SeImpersonatePrivilege'
          $log = 'C:\ProgramData\Nerve\state\log.jsonl'
          if (Test-Path $log) { Get-Content $log -Tail 300 }
          # The node's record of the folder grants it put on.
          Get-Content 'C:\ProgramData\Nerve\state\grants.json' -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'nerve-node' } -MaxEvents 50 |
            Format-List TimeCreated, Message
          icacls C:\
          Get-ChildItem C:\ -Directory -Filter 'nerve-w2-*' | ForEach-Object {
            @($_) + @(Get-ChildItem $_.FullName -Directory -Recurse -Depth 1) | ForEach-Object {
              icacls $_.FullName
              $acl = Get-Acl -LiteralPath $_.FullName
              "owner $($acl.Owner): $($acl.Sddl)"
            }
          }
          exit 0
      # Chrome and a Node.js with WebSocket come with the image; the web UI
      # smoke test drives the one with the other.
      - name: The center as a Windows service
        run: |
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { throw "no Chrome at $chrome" }
          $node = (Get-Command node).Source
          & $node -e 'if (typeof WebSocket !== "function") { console.error("this Node.js " + process.version + " has no WebSocket"); process.exit(1); }'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:NERVE_CENTER_PROGRAM = (Resolve-Path dist/nerve-center.exe).Path
          $env:NERVE_UI_SMOKE_CHROME = $chrome
          $env:NERVE_UI_SMOKE_NODE = $node
          $env:NERVE_UI_SMOKE_SCRIPT = (Resolve-Path .github/scripts/web-ui-smoke.mjs).Path
          $said = & dist/tests/win_service.exe --ignored --exact --nocapture --test-threads=1 the_center_runs_as_a_windows_service 2>&1 |
            Tee-Object "$env:RUNNER_TEMP/center.log" | Out-String
          Write-Host $said
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($said -notmatch 'test result: ok\. 1 passed') { throw 'the center service test did not run' }
      # winget's way: the entry's quiet uninstall, which keeps the data, and
      # the silent install, which asks nothing and takes the owner and the
      # data that stayed.
      - name: The quiet uninstall keeps the data, --silent installs again
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Nerve'
          $quiet = (Get-ItemProperty $key).QuietUninstallString
          if ($quiet -notmatch '^"([^"]+)" (\S+)$') { throw "a quiet uninstall of another form: $quiet" }
          $exe, $arg = $Matches[1], $Matches[2]
          & $exe $arg 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "the quiet uninstall failed ($LASTEXITCODE)" }
          if (Get-Service nerve -ErrorAction SilentlyContinue) { throw 'the service stays' }
          if (Test-Path $key) { throw 'the Apps & features entry stays' }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Nerve.lnk") { throw 'the Start menu link stays' }
          if (Test-Path 'Registry::HKEY_CLASSES_ROOT\nerve') { throw 'the nerve:// handler stays' }
          if (-not (Test-Path 'C:\ProgramData\Nerve\config\node.toml')) { throw 'the data went with it' }
          $env:NERVE_DESKTOP_USER_SID = $env:NERVE_TEST_SID
          & dist/nerve-node-desktop.exe --silent 2>&1 | Tee-Object "$env:RUNNER_TEMP/silent.log" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "the silent install failed ($LASTEXITCODE)" }
          if ((Get-Service nerve-node).Status -ne 'Running') { throw 'the node does not run after the silent install' }
          if (-not (Test-Path $key)) { throw 'no Apps & features entry after the silent install' }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Nerve.lnk")) { throw 'no Start menu link after the silent install' }
      - name: Uninstall
        if: success() || failure()
        run: |
          # The app's program is a Windows program, not a console one:
          # PowerShell waits for it to end only when its output is piped.
          $bin = "$env:ProgramFiles\Nerve\nerve-node-desktop.exe"
          if (Test-Path $bin) {
            & $bin uninstall --purge 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # nerve-run, its service and its entries go with it.
            if (Get-LocalUser nerve-run -ErrorAction SilentlyContinue) { throw 'nerve-run stays' }
            if (Get-Service nerve-run-profile -ErrorAction SilentlyContinue) { throw 'nerve-run-profile stays' }
          }
      # A test that returns early says so with `skipped` at the start of a
      # line, or behind `test <name> ... ` with one test thread.
      - name: No test skipped
        if: success() || failure()
        run: |
          $logs = Get-ChildItem "$env:RUNNER_TEMP" -Filter *.log | Where-Object Name -in 'real.log', 'installed.log', 'center.log'
          $skipped = $logs | Select-String -Pattern '(^|\.\.\. )skipped'
          if ($skipped) { $skipped; throw 'a test skipped' }
