# A release of Nerve, started by hand: Actions, Release, Run workflow, with the
# branch to build from, the kind (pre-release or release) and the version
# (docs/dev/releasing.md).
#
# `check` stops a bad run before anything is built: a release from any branch
# but main, a version that is not the one in Cargo.toml, a release whose tag
# exists or that has no CHANGELOG.md section (a pre-release never reads
# CHANGELOG.md), a pre-release of a version that is released already. It picks the commit (the head of the branch when the run
# starts) and the tag, then runs fmt, clippy and the tests. Every build job
# checks out that commit, so a push to the branch during the run changes
# nothing. `conformance` runs the conformance suite against the Linux binaries
# that were built (the ones that will be released), on a runner of their own
# architecture, and `installed` installs and drives them on the distributions
# Nerve supports (.github/workflows/installed.yml); the desktop app's .deb and
# .rpm are installed on Ubuntu and Fedora (`desktop-packages-test`). `publish` is the only job
# that may write: it tags the commit and publishes the release only after
# every check, build, the conformance run and the install test passed, so a
# failed run leaves no tag. Tags are never moved or reused.
#
# No secrets: nothing is signed (the node's `update` checks a download against
# SHA256SUMS). The actions are pinned by commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from (a release only from main)"
        type: string
        required: true
        default: main
      kind:
        description: "pre-release (any branch, tag pre<N>-v<version>) or release (main only, tag v<version>)"
        type: choice
        required: true
        default: pre-release
        options:
          - pre-release
          - release
      version:
        description: "Version x.y.z, the one in the workspace Cargo.toml"
        type: string
        required: true
      # Off until 0.1.0, which turns it on: 0.0.7 publishes the Linux programs
      # only (docs/dev/releasing.md).
      windows:
        description: "Build and publish the Windows programs too (off until 0.1.0)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One release run at a time, so two runs cannot pick the same pre-release number,
# and a second release of a version finds the first one's tag.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Pinned, so a release builds the same way again.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: never
  # The inputs reach the scripts through the environment only, never as text in
  # a script.
  BRANCH: ${{ inputs.branch }}
  KIND: ${{ inputs.kind }}
  VERSION: ${{ inputs.version }}
  WINDOWS: ${{ inputs.windows }}
  # The git ref the programs' help links to for the user guide: a release
  # links its own tag (made after the run, before anyone has the programs), a
  # pre-release links main, since its tag exists only after the run.
  NERVE_GUIDE_REF: ${{ inputs.kind == 'release' && format('v{0}', inputs.version) || 'main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: The inputs
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version '$VERSION' is not x.y.z" >&2
            exit 1
          fi
          case "$KIND" in
            pre-release | release) ;;
            *)
              echo "kind '$KIND' is neither pre-release nor release" >&2
              exit 1
              ;;
          esac
          if [ "$KIND" = release ] && [ "$BRANCH" != main ]; then
            echo "a release only comes from main, not from '$BRANCH': merge to main first, or make a pre-release" >&2
            exit 1
          fi
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$BRANCH" == -* ]] \
            || ! git check-ref-format "refs/heads/$BRANCH"; then
            echo "'$BRANCH' is not a branch name" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      # The commit every job builds and `publish` tags.
      - name: The commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$BRANCH is at $sha"
      # A release is v<version> and only once. A pre-release is pre<N>-v<version>,
      # N one more than the highest one so far (pre1 first), and only for a
      # version that is not released yet. `publish` creates the tag; creating it
      # fails there if it has come to exist since.
      - name: The tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          if [ "$KIND" = release ]; then
            tag="v$VERSION"
            if grep -qxF "$tag" <<< "$tags"; then
              echo "tag $tag exists, and tags are never moved or reused: raise the version" >&2
              exit 1
            fi
          else
            # The pre-release would be numbered as older than the release but
            # published after it, with newer code, and a list of pre-releases
            # sorted by date would show it as the newest.
            if grep -qxF "v$VERSION" <<< "$tags"; then
              echo "v$VERSION is released already, and a pre-release of it would come after it: raise the version on the branch first" >&2
              exit 1
            fi
            n=$({ grep -E "^pre[0-9]+-v${VERSION//./\\.}\$" <<< "$tags" || true; } \
              | sed -E 's/^pre([0-9]+)-v.*$/\1/' | sort -n | tail -n 1)
            tag="pre$((10#${n:-0} + 1))-v$VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "the tag will be $tag"
          {
            echo "- $KIND $tag"
            echo "- branch $BRANCH at $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: The version is the one in Cargo.toml
        run: |
          meta=$(cargo metadata --locked --no-deps --format-version 1)
          for p in nerve-center nerve-node nerve-node-desktop; do
            v=$(jq -r --arg p "$p" '.packages[] | select(.name == $p) | .version' <<< "$meta")
            if [ "$v" != "$VERSION" ]; then
              echo "the version is $VERSION, Cargo.toml says $p ${v:-(missing)}" >&2
              exit 1
            fi
          done
      # The release notes are the version's section of CHANGELOG.md, and only a
      # release has them (it needs the section); a pre-release does not read the
      # changelog. `publish` has no checkout, so the section travels as an artifact.
      - name: The changelog section
        if: ${{ env.KIND == 'release' }}
        run: |
          mkdir notes
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v); next }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes/changelog.md
          if [ ! -s notes/changelog.md ]; then
            echo "CHANGELOG.md has no section '## $VERSION' with entries: write it, merge to main, then run this again" >&2
            exit 1
          fi
          cat notes/changelog.md
      - if: ${{ env.KIND == 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/changelog.md
          if-no-files-found: error
      - run: cargo fmt --check
      # The desktop app (crates/nerve-node-desktop) links the system's fontconfig.
      - name: Build dependencies of the desktop app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # A native arm64 runner: no cross C compiler for ring needed.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      SUFFIX: ${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: A C compiler for musl (ring's C parts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target "$TARGET" -p nerve-center -p nerve-node
          mkdir dist
          for b in nerve-center nerve-node; do
            cp "target/$TARGET/release/$b" "dist/$b-$SUFFIX"
          done
      - name: Static, and the version the tag names
        run: |
          for b in nerve-center nerve-node; do
            file -b "dist/$b-$SUFFIX" | tee /dev/stderr | grep -Eq 'static(-pie)? linked|statically linked'
            said=$("dist/$b-$SUFFIX" --version)
            if [ "$said" != "$b $VERSION" ]; then
              echo "$b-$SUFFIX says '$said', not '$b $VERSION'" >&2
              exit 1
            fi
          done
      # The real-machine tests of the `installed` job, built from the same
      # commit; they are not published (`publish` takes nerve-* only).
      - name: The test programs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo test --locked --target "$TARGET" -p nerve-node \
            --test real_account --test real_root_owner --test keyring --no-run --message-format=json \
            | python3 -c 'import json,sys; [print(m["target"]["name"], m["executable"]) for m in map(json.loads, sys.stdin) if m.get("executable") and m["target"]["kind"] == ["test"]]' \
            > "$RUNNER_TEMP/tests.path"
          mkdir tests
          while read -r name exe; do strip -o "tests/$name" "$exe"; done < "$RUNNER_TEMP/tests.path"
          test "$(find tests -type f | wc -l)" = 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nerve-${{ env.SUFFIX }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ env.SUFFIX }}
          path: tests/*
          if-no-files-found: error

  # The desktop app for Linux (crates/nerve-node-desktop): the node with its
  # window in one program. It links the system's fontconfig and glibc, so it
  # is not static. It is built on the oldest runner GitHub has, Ubuntu 22.04,
  # so it runs where glibc is 2.35 or newer (Debian 12, Ubuntu 22.04).
  desktop-linux:
    needs: check
    runs-on: ubuntu-22.04
    env:
      SUFFIX: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build dependencies of the desktop app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Build
        run: |
          cargo build --release --locked -p nerve-node-desktop
          mkdir dist
          cp target/release/nerve-node-desktop "dist/nerve-node-desktop-$SUFFIX"
      - name: The version the tag names, and the glibc it needs
        run: |
          said=$("dist/nerve-node-desktop-$SUFFIX" --version)
          if [ "$said" != "nerve-node-desktop $VERSION" ]; then
            echo "nerve-node-desktop-$SUFFIX says '$said', not 'nerve-node-desktop $VERSION'" >&2
            exit 1
          fi
          glibc=$(objdump -T "dist/nerve-node-desktop-$SUFFIX" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "- nerve-node-desktop-$SUFFIX needs $glibc" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nerve-desktop-${{ env.SUFFIX }}
          path: dist/*
          if-no-files-found: error

  # The desktop app for Linux as a .deb and an .rpm (#212), from the program
  # `desktop-linux` built: the program writes the packages' files itself
  # (`__package-root`) and dpkg-deb and rpmbuild, from apt, pack them
  # (.github/scripts/desktop-packages.sh).
  desktop-packages:
    needs: [check, desktop-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nerve-desktop-x86_64-linux
          path: program
      - name: rpmbuild, and the fontconfig the program links
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libfontconfig1
      - name: The packages
        run: |
          chmod +x program/nerve-node-desktop-x86_64-linux
          .github/scripts/desktop-packages.sh program/nerve-node-desktop-x86_64-linux dist
          test -f "dist/nerve-node-desktop_${VERSION}_amd64.deb"
          test -f "dist/nerve-node-desktop-${VERSION}.x86_64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nerve-desktop-packages
          path: dist/*
          if-no-files-found: error

  # Each package installed where install.md says it is tested, in a
  # container: the .deb on Ubuntu 22.04 and 24.04, the .rpm on Fedora. The
  # package manager brings what the app links; the app starts headless
  # (`--version`), its menu entry is valid and opens the package's
  # program, and removing the package removes them.
  desktop-packages-test:
    needs: desktop-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: fedora:44
            kind: rpm
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nerve-desktop-packages
          path: dist
      - name: Install the package
        run: |
          if [ "$KIND" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              "./dist/nerve-node-desktop_${VERSION}_amd64.deb" desktop-file-utils
          else
            dnf install -y "./dist/nerve-node-desktop-${VERSION}.x86_64.rpm" desktop-file-utils
          fi
      - name: The app starts, and its menu entry opens it
        run: |
          said=$(nerve-node-desktop --version)
          if [ "$said" != "nerve-node-desktop $VERSION" ]; then
            echo "the installed app says '$said', not 'nerve-node-desktop $VERSION'" >&2
            exit 1
          fi
          test -x /usr/bin/nerve-node-desktop
          entry=/usr/share/applications/nerve-node-desktop.desktop
          desktop-file-validate "$entry"
          grep -qx 'Exec=/usr/bin/nerve-node-desktop %u' "$entry"
          test -f /usr/share/icons/hicolor/scalable/apps/nerve-node-desktop.svg
          test "$(cat /usr/share/nerve-node-desktop/package)" = "$KIND"
      - name: Removing the package removes the app
        run: |
          if [ "$KIND" = deb ]; then
            apt-get remove -y nerve-node-desktop
          else
            dnf remove -y nerve-node-desktop
          fi
          test ! -e /usr/bin/nerve-node-desktop
          test ! -e /usr/share/applications/nerve-node-desktop.desktop

  # The conformance suite (crates/nerve-conformance) against the binaries that
  # were built, not against the source: the end-to-end tests start the real
  # `nerve-center` and `nerve-node` from NERVE_CENTER_BIN and NERVE_NODE_BIN
  # instead of building them. The static musl binaries are what users run, so a
  # defect that only they have (a missing system file, a libc difference, a
  # strip that broke something) fails the release here. Each architecture runs
  # on a native runner, like its build. The test code is built from the commit
  # being released.
  conformance:
    needs: [check, linux]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SUFFIX: ${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nerve-${{ env.SUFFIX }}
          path: dist
      # The artifact does not keep the executable bit.
      - name: The released binaries
        run: |
          chmod +x dist/*
          ls -l dist
      - name: Conformance suite
        env:
          NERVE_CENTER_BIN: ${{ github.workspace }}/dist/nerve-center-${{ env.SUFFIX }}
          NERVE_NODE_BIN: ${{ github.workspace }}/dist/nerve-node-${{ env.SUFFIX }}
        run: cargo test --locked -p nerve-conformance --no-fail-fast

  # The binaries to be released, installed and driven on Ubuntu 22.04 and
  # 24.04 (x86_64 and arm64) and Debian 12, with the scripts of the commit
  # being released.
  installed:
    needs: [check, linux]
    uses: ./.github/workflows/installed.yml
    with:
      binaries: nerve-{0}-linux
      tests: tests-{0}-linux
      ref: ${{ needs.check.outputs.sha }}

  # Only with the input `windows`: 0.0.7 publishes no Windows program.
  windows:
    needs: check
    if: ${{ inputs.windows }}
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
      SUFFIX: x86_64-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      # The static C runtime: a fresh Windows has no vcruntime140.dll.
      # No nerve-node on its own: on Windows the desktop app is the only way
      # to the node (docs/dev/windows.md).
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --locked --target "$TARGET" -p nerve-center -p nerve-node-desktop
          mkdir dist
          for b in nerve-center nerve-node-desktop; do
            cp "target/$TARGET/release/$b.exe" "dist/$b-$SUFFIX.exe"
          done
      # The desktop app is a program without a console; run from bash, it
      # writes to the pipe it is given all the same.
      - name: No Visual C++ runtime, and the version the tag names
        run: |
          for b in nerve-center nerve-node-desktop; do
            if grep -aqi 'vcruntime140' "dist/$b-$SUFFIX.exe"; then
              echo "$b-$SUFFIX.exe imports the Visual C++ runtime" >&2
              exit 1
            fi
            said=$("dist/$b-$SUFFIX.exe" --version | tr -d '\r')
            if [ "$said" != "$b $VERSION" ]; then
              echo "$b-$SUFFIX.exe says '$said', not '$b $VERSION'" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nerve-${{ env.SUFFIX }}
          path: dist/*
          if-no-files-found: error

  # No checkout and no build: only the artifacts of the jobs above and the API.
  # The release is made as a draft with its files first, then the tag, then the
  # draft is published, so that the step most likely to fail (the upload) runs
  # before there is a tag. If anything here fails, the last step removes the
  # draft and the tag this run created, and nothing else (see there). The
  # Windows job is skipped without the input `windows`, which would skip this
  # job too, so it says itself what it needs: every other job passed, and the
  # Windows job passed with the input or was skipped without it.
  publish:
    needs: [check, linux, desktop-linux, desktop-packages, desktop-packages-test, windows, conformance, installed]
    if: >-
      ${{ !cancelled()
      && needs.check.result == 'success'
      && needs.linux.result == 'success'
      && needs.desktop-linux.result == 'success'
      && needs.desktop-packages.result == 'success'
      && needs.desktop-packages-test.result == 'success'
      && needs.conformance.result == 'success'
      && needs.installed.result == 'success'
      && needs.windows.result == (inputs.windows && 'success' || 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.check.outputs.sha }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nerve-*
          path: dist
          merge-multiple: true
      # Only a release has notes.
      - if: ${{ env.KIND == 'release' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - name: The checksums
        run: |
          cd dist
          # Two Linux programs on each of two machines and the Linux desktop
          # app, also as a .deb and an .rpm; with Windows also its two
          # (nerve-node-* takes the desktop app's as well; Windows has no
          # nerve-node of its own).
          want=7
          if [ "$WINDOWS" = true ]; then
            want=9
          fi
          files=(nerve-center-* nerve-node-*)
          if [ "${#files[@]}" != "$want" ]; then
            echo "expected $want binaries, got: ${files[*]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: The draft release
        run: |
          case "$KIND" in
            release)
              title="Nerve $VERSION"
              prerelease=false
              ;;
            *)
              title="Nerve $VERSION (pre-release $TAG)"
              prerelease=true
              ;;
          esac
          if [ "$WINDOWS" = true ]; then
            footer="Static Linux binaries (x86_64, aarch64) of \`nerve-center\` and \`nerve-node\`, the desktop app \`nerve-node-desktop\` for Linux x86_64 (glibc 2.35 or newer; also as a .deb and an .rpm) and Windows x86_64, and \`nerve-center\` for Windows x86_64, built from $SHA. On Windows the desktop app is the node: there is no \`nerve-node\` for Windows. SHA256SUMS lists their checksums. They are not signed; \`nerve-node update\` and the desktop app's update check the one they download against SHA256SUMS (docs/user/install.md)."
          else
            footer="Static Linux binaries (x86_64, aarch64) of \`nerve-center\` and \`nerve-node\`, and the desktop app \`nerve-node-desktop\` for Linux x86_64 (glibc 2.35 or newer; also as a .deb and an .rpm), built from $SHA. Windows comes with 0.1.0. SHA256SUMS lists their checksums. They are not signed; \`nerve-node update\` and the desktop app's update check the one they download against SHA256SUMS (docs/user/install.md)."
          fi
          # A pre-release's body is the footer alone.
          if [ "$KIND" = release ]; then
            { cat notes/changelog.md; echo; echo "$footer"; } > release-notes.md
          else
            echo "$footer" > release-notes.md
          fi
          # The draft is made without files, and its id is kept before the upload
          # (the step most likely to fail): the clean-up then removes this draft
          # by its id and no other draft of the tag.
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$SHA" -f name="$title" \
            -F body=@release-notes.md -F draft=true -F prerelease="$prerelease" --jq .id)
          if [ -z "$id" ]; then
            echo "the draft release for $TAG has no id" >&2
            exit 1
          fi
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          for f in dist/*; do
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=${f##*/}" \
              > /dev/null
          done
      # Creating the ref fails if the tag exists, so no tag is ever moved. The
      # tag object is recorded before the ref is made, so that the clean-up can
      # tell this run's tag from one that was there already.
      - name: The tag
        run: |
          if [ "$KIND" = release ]; then
            message="Nerve $VERSION"
          else
            message="Nerve $VERSION, pre-release $TAG"
          fi
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$message" \
            -f object="$SHA" -f type=commit --jq .sha)
          echo "TAG_OBJECT=$object" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
      # A release is marked latest; a pre-release never is.
      - name: Publish
        run: |
          latest=false
          if [ "$KIND" = release ]; then
            latest=true
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$latest" --jq .html_url
      # What a failed or cancelled run removes: the draft it made (by its id) and
      # the tag it made (the one that points at its tag object), and only when
      # GitHub says no release of the tag is published. A Publish whose answer
      # was lost may have published all the same, and then the tag is that
      # release's. When GitHub cannot be asked, nothing is removed: a tag left
      # over can be deleted by hand, a published release without its tag cannot
      # be put back. A draft the owner made for the same tag has another id and
      # stays.
      - name: Clean up after a failure
        if: ${{ failure() || cancelled() }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          if ! published=$(gh api --paginate "$api/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .id'); then
            echo "::warning::cannot tell whether $TAG is published, so its draft and tag are left as they are"
            exit 0
          fi
          # true, false, or empty when there is no such release or it cannot be read.
          draft=
          if [ -n "${RELEASE_ID:-}" ]; then
            draft=$(gh api "$api/releases/$RELEASE_ID" --jq .draft || true)
          fi
          if [ -n "$published" ] || [ "$draft" = false ]; then
            echo "$TAG is published: its release and tag stay"
            exit 0
          fi
          if [ "$draft" = true ]; then
            gh api --method DELETE "$api/releases/$RELEASE_ID" || echo "::warning::the draft release $RELEASE_ID of $TAG is still there"
          fi
          if [ -n "${TAG_OBJECT:-}" ]; then
            at=$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha || true)
            if [ "$at" = "$TAG_OBJECT" ]; then
              gh api --method DELETE "$api/git/refs/tags/$TAG" || echo "::warning::the tag $TAG is still there"
            fi
          fi
